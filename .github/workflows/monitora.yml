name: Monitor albi
run-name: ${{ inputs.azione == 'albi' && 'Ricerca link albi' || 'Controllo determine' }}

on:
  workflow_dispatch:
    inputs:
      azione:
        description: "monitora = controlla le determine, albi = cerca i link agli albi"
        required: true
        default: monitora
        type: choice
        options: [monitora, albi]
      modo:
        description: "ultimo = dall'ultimo controllo di ogni comune, data = dalla data indicata"
        default: ultimo
        type: choice
        options: [ultimo, data]
      data:
        description: "Data di partenza (AAAA-MM-GG)"
        default: ""
      solo:
        description: "Solo questi comuni, separati da punto e virgola (vuoto = tutti)"
        default: ""
      regione:
        description: "Ricerca albi: regione"
        default: "Veneto"
      provincia:
        description: "Ricerca albi: sigla della provincia (vuoto = tutta la regione)"
        default: ""
      salta_trovati:
        description: "Ricerca albi: salta i comuni già trovati (si/no)"
        default: "si"
  # Controllo automatico: ogni lunedì alle 7 (ora italiana). Cancella queste due righe per disattivarlo.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

concurrency:
  group: monitor-albi
  cancel-in-progress: false

jobs:
  lavoro:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
        with:
          # parte sempre dall'ultima versione dei dati, anche se il lavoro è rimasto in coda
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cerca i link agli albi
        if: inputs.azione == 'albi'
        env:
          REGIONE: ${{ inputs.regione }}
          PROVINCIA: ${{ inputs.provincia }}
          SOLO: ${{ inputs.solo }}
          SALTA: ${{ inputs.salta_trovati }}
        run: python esegui.py albi --regione "$REGIONE" --provincia "$PROVINCIA" --comuni "$SOLO" --salta-trovati "$SALTA"

      - name: Controlla le determine
        id: monitora
        if: inputs.azione != 'albi'
        env:
          MODO: ${{ inputs.modo || 'ultimo' }}
          DATA: ${{ inputs.data }}
          SOLO: ${{ inputs.solo }}
        run: python esegui.py monitora --modo "$MODO" --data "$DATA" --solo "$SOLO"

      - name: Pubblica gli allegati
        if: steps.monitora.outputs.zip != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.monitora.outputs.tag }}" "${{ steps.monitora.outputs.zip }}"
          --title "Allegati ${{ steps.monitora.outputs.tag }}"
          --notes "Excel e allegati del controllo. Estrai lo zip: i link nell'Excel aprono i file."

      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "monitor-albi"
          git config user.email "monitor-albi@users.noreply.github.com"
          git add -A docs/
          git diff --cached --quiet && exit 0
          git commit -m "Risultati $(date +'%Y-%m-%d %H:%M')"
          # se nel frattempo qualcuno ha salvato altro, unisce e in caso di conflitto tiene i risultati appena prodotti
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
