name: Pubblica la pagina

# La pagina si ripubblica solo quando cambia la pagina stessa, non a ogni salvataggio di dati
# (fissa, nascondi, risultati...): i dati la pagina li legge direttamente dal repository.
# Attivo da: Settings > Pages > Source = GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/dati/italia.json", ".github/workflows/pagina.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file della pagina
        run: |
          mkdir -p sito/dati
          cp docs/index.html sito/
          cp docs/dati/italia.json sito/dati/
          touch sito/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
