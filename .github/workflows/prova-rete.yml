name: Prova rete (temporanea)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null && sudo apt-get install -y -q xvfb >/dev/null
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for i in 1 2; do curl -sS -m 20 -o /dev/null -w "curl %{http_code}\n" -A "$UA" https://www.halleyweb.com/c017085/mc/mc_p_ricerca.php || true; done
          xvfb-run -a python prova_pw.py
          for i in 1 2; do curl -sS -m 20 -o b.html -w "curl dopo %{http_code}\n" -A "$UA" https://www.halleyweb.com/c017085/mc/mc_p_ricerca.php || true; done
          grep -c "<tr" b.html || true
